name: Release PassiveWubi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version number (for example 2.1.2)
        required: true
        default: "2.1.2"

permissions:
  contents: write

jobs:
  windows:
    name: Windows Flutter package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}".TrimStart("v")
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows
        shell: pwsh
        run: ./scripts/build_flutter_windows.ps1 -Version "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-flutter
          path: dist/PassiveWubi-Flutter-v*-win-x64.zip*

  linux:
    name: Ubuntu DEB package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev liblzma-dev clang cmake ninja-build pkg-config xvfb dpkg-dev patchelf
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Test and build deb
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build linux --release
          bash packaging/linux/build_deb.sh "${{ steps.version.outputs.value }}"
          cd dist
          sha256sum PassiveWubi-Flutter-v*-linux-amd64.deb > PassiveWubi-Flutter-linux-amd64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: |
            dist/PassiveWubi-Flutter-v*-linux-amd64.deb
            dist/PassiveWubi-Flutter-linux-amd64.sha256

  release:
    name: Publish release
    needs:
      - windows
      - linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "$env:GITHUB_REF_NAME".TrimStart("v")
          }
          $tag = "v$version"
          $assetPaths = @(
            Get-ChildItem -LiteralPath release-assets -File |
              ForEach-Object { $_.FullName }
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assetPaths --clobber
          } else {
            gh release create $tag --draft --title "肌忆五笔 v$version" `
              --generate-notes --target "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag $assetPaths --clobber
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false
