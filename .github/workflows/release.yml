name: Release PassiveWubi for Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version number (for example 2.1.0)
        required: true
        default: "2.1.0"

permissions:
  contents: write

jobs:
  windows:
    name: Windows Flutter package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}".TrimStart("v")
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows
        shell: pwsh
        run: ./scripts/build_flutter_windows.ps1 -Version "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-flutter
          path: dist/PassiveWubi-Flutter-v*-win-x64.zip*

  release:
    name: Publish release
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "$env:GITHUB_REF_NAME".TrimStart("v")
          }
          $tag = "v$version"
          $assetPaths = @(
            Get-ChildItem -LiteralPath release-assets -File |
              ForEach-Object { $_.FullName }
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assetPaths --clobber
          } else {
            gh release create $tag --draft --title "肌忆五笔 v$version" `
              --generate-notes --target "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag $assetPaths --clobber
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false
