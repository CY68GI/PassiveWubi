name: Release Flutter clients

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version number (for example 2.0.1)
        required: true
        default: "2.0.1"

permissions:
  contents: write

jobs:
  windows:
    name: Windows Flutter package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}".TrimStart("v")
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows
        shell: pwsh
        run: ./scripts/build_flutter_windows.ps1 -Version "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-flutter
          path: dist/PassiveWubi-Flutter-v*-win-x64.zip*

  linux:
    name: Ubuntu Flutter package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev liblzma-dev clang cmake ninja-build pkg-config xvfb dpkg-dev patchelf
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Test and build deb
        run: |
          flutter pub get
          flutter test
          flutter build linux --release
          bash packaging/linux/build_deb.sh "${{ steps.version.outputs.value }}"
          cd dist
          sha256sum PassiveWubi-Flutter-v*-linux-amd64.deb > PassiveWubi-Flutter-linux-amd64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flutter
          path: |
            dist/PassiveWubi-Flutter-v*-linux-amd64.deb
            dist/PassiveWubi-Flutter-linux-amd64.sha256

  release:
    name: Publish release
    needs:
      - windows
      - linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/*/* --clobber
          else
            gh release create "$tag" \
              --draft \
              --title "肌忆五笔 v$version" \
              --generate-notes \
              --target "${{ github.sha }}"
            gh release upload "$tag" release-assets/*/* --clobber
          fi
          gh release edit "$tag" --draft=false
