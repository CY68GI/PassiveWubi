name: Build Flutter clients

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows Flutter build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Resolve and verify
        shell: pwsh
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --release

  ubuntu:
    name: Ubuntu Flutter build and deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev liblzma-dev clang cmake ninja-build pkg-config xvfb
      - name: Test and build Linux
        run: |
          flutter pub get
          flutter test
          flutter build linux --release
          bash packaging/linux/build_deb.sh 2.0.0
