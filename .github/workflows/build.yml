name: Build clients

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu:
    name: Ubuntu 24.04 Linux client
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build shared core and Linux client
        run: |
          dotnet build src/PassiveWubi.Core/PassiveWubi.Core.csproj -c Release
          dotnet build src/PassiveWubi.Linux/PassiveWubi.Linux.csproj -c Release

      - name: Publish self-contained Linux binary
        run: |
          dotnet publish src/PassiveWubi.Linux/PassiveWubi.Linux.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o artifacts/linux
          test -x artifacts/linux/PassiveWubi.Linux
